# Alembic configuration for the WAVE backend.
#
# Migrations are hand-written (NOT autogenerated) because experiment *types*
# create their own dynamic data tables at runtime that are not part of the
# SQLAlchemy model metadata — a naive autogenerate would try to DROP them.
# env.py additionally restricts Alembic to the managed model tables.
#
# The DB URL is resolved at runtime from the app's db_config (env vars), so it
# is intentionally NOT set here.

[alembic]
script_location = alembic
prepend_sys_path = src
# Use a timezone-aware, sortable prefix is unnecessary here since we name
# revisions explicitly (0001_, 0002_, ...).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
